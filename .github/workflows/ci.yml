# CI do PaceFlow: roda automaticamente no GitHub a cada push na main
# e a cada pull request. Se qualquer etapa falhar, o PR fica marcado
# com um X vermelho e não deve ser mesclado até ser corrigido.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Se chegar um push novo no mesmo PR, cancela a execução antiga
# (não faz sentido gastar minutos de CI testando um commit já superado)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório para a máquina do CI
      - name: Checkout
        uses: actions/checkout@v5

      # Node 24 = mesma versão usada em desenvolvimento; o npm que acompanha
      # cada Node lê o package-lock.json de formas ligeiramente diferentes,
      # então CI e máquina local precisam estar alinhados
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm ci instala exatamente as versões do package-lock.json
      # (mais previsível que npm install para ambientes de CI)
      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificação de tipos (TypeScript)
        run: npm run typecheck

      - name: Formatação (Prettier)
        run: npm run format:check

      # --coverage também aplica o piso de cobertura do jest.config.js
      - name: Testes (Jest) com cobertura
        run: npm run test:coverage

      # expo-doctor confere se as versões das libs batem com o SDK do Expo
      # e se a configuração do app é válida — pega incompatibilidades antes
      # de elas virarem um build quebrado no celular
      - name: Saúde do projeto Expo (expo-doctor)
        run: npx expo-doctor@latest
